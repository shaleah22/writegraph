<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>body{margin:0} img{max-width:100%} [hidden]{display:none!important}</style>
<title>Write It, Graph It</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Overpass:wght@600;800;900&family=Overpass+Mono:wght@500;700&display=swap">
<style>
/* Layout: one problem card at a time under a highway-guide-sign header; number line drawn in "teacher's blue marker" */
:root {
  --bg: #edf1ed;
  --surface: #ffffff;
  --ink: #16211b;
  --muted: #55645b;
  --line: #cdd8cf;
  --accent: #0d6a43;
  --accent-ink: #ffffff;
  --plot: #1b4fd1;
  --plot-soft: rgba(27, 79, 209, .18);
  --good: #17733a;
  --good-bg: #e2f2e7;
  --bad: #b42318;
  --bad-bg: #fbe8e5;
  --sign-white: #ffffff;
  --sign-black: #141414;
  --sign-green: #0d6a43;
  --sign-blue: #1d4fa0;
  --sign-brown: #6b3a24;
  --f-display: "Overpass", "Arial Narrow", system-ui, sans-serif;
  --f-body: "Atkinson Hyperlegible", system-ui, -apple-system, "Segoe UI", sans-serif;
  --f-mono: "Overpass Mono", ui-monospace, Menlo, Consolas, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0f1612; --surface: #17211b; --ink: #e4ebe5; --muted: #99a99f; --line: #2c3a31;
    --accent: #3daa76; --accent-ink: #07130c; --plot: #7ea5ff; --plot-soft: rgba(126, 165, 255, .22);
    --good: #62cb89; --good-bg: #13291c; --bad: #ff8b7c; --bad-bg: #2f1612;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0f1612; --surface: #17211b; --ink: #e4ebe5; --muted: #99a99f; --line: #2c3a31;
  --accent: #3daa76; --accent-ink: #07130c; --plot: #7ea5ff; --plot-soft: rgba(126, 165, 255, .22);
  --good: #62cb89; --good-bg: #13291c; --bad: #ff8b7c; --bad-bg: #2f1612;
  color-scheme: dark;
}
* { box-sizing: border-box; }
body {
  background: var(--bg); color: var(--ink); font-family: var(--f-body); font-size: 16px; line-height: 1.5;
}
.wrap {
  max-width: 1280px; margin: 0 auto;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 20px 48px;
  display: flex; flex-direction: column; gap: 18px;
}

/* Header styled as a guide sign */
.guide {
  background: var(--sign-green); color: var(--sign-white);
  border-radius: 14px; padding: 6px;
}
.guide-inner {
  border: 3px solid var(--sign-white); border-radius: 10px;
  padding: 16px 20px; display: flex; flex-wrap: wrap; gap: 14px 24px; align-items: center; justify-content: space-between;
}
.guide h1 {
  margin: 0; font-family: var(--f-display); font-weight: 900; font-size: clamp(1.7rem, 5vw, 2.4rem);
  letter-spacing: .01em; line-height: 1.05; text-wrap: balance;
}
.guide p { margin: 4px 0 0; font-size: .98rem; max-width: 46ch; opacity: .92; }
.guide-side { display: flex; flex-direction: column; align-items: flex-end; gap: 8px; }
.score { font-family: var(--f-display); font-weight: 800; font-size: 1rem; letter-spacing: .04em; text-transform: uppercase; text-align: right; }
.score b { font-size: 1.5rem; font-variant-numeric: tabular-nums; }
.btn-sign {
  font: 700 .9rem var(--f-display); letter-spacing: .06em; text-transform: uppercase;
  background: var(--sign-white); color: var(--sign-green); border: 0; border-radius: 8px; padding: 8px 14px; cursor: pointer;
}
.btn-sign:hover { filter: brightness(.94); }

/* Clue words */
details.clues { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; }
details.clues summary {
  cursor: pointer; padding: 12px 16px; font-family: var(--f-display); font-weight: 800; letter-spacing: .05em; text-transform: uppercase; font-size: .9rem;
}
.clue-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); gap: 12px; padding: 0 16px 14px; }
.clue-col { min-width: 0; }
.clue-col .sym { font-family: var(--f-mono); font-weight: 700; font-size: 1.25rem; color: var(--plot); }
.clue-col .rule { font-size: .82rem; color: var(--muted); margin: 2px 0 6px; }
.clue-col ul { margin: 0; padding-left: 18px; font-size: .92rem; }
.clue-note { padding: 0 16px 14px; font-size: .9rem; color: var(--muted); margin: 0; }

/* Progress dots */
.dots { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.dots-label { font-family: var(--f-display); font-weight: 800; font-size: .8rem; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); margin-right: 4px; }
.dot {
  width: 34px; height: 34px; border-radius: 8px; border: 2px solid var(--line); background: var(--surface); color: var(--muted);
  font: 700 .85rem var(--f-mono); cursor: pointer; display: grid; place-items: center; padding: 0;
}
.dot.right { background: var(--good-bg); border-color: var(--good); color: var(--good); }
.dot.fixed { background: var(--surface); border-color: var(--good); color: var(--good); border-style: dashed; }
.dot.miss { background: var(--bad-bg); border-color: var(--bad); color: var(--bad); }
.dot.current { outline: 3px solid var(--plot); outline-offset: 2px; }

.banner {
  background: var(--good-bg); border: 1px solid var(--good); color: var(--ink); border-radius: 12px; padding: 14px 18px;
  display: flex; flex-wrap: wrap; gap: 10px 16px; align-items: center; justify-content: space-between;
}
.banner strong { font-family: var(--f-display); font-size: 1.15rem; }

/* Problem card */
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 16px; padding: 20px; display: flex; flex-direction: column; gap: 20px; }
@media (min-width: 900px) {
  .card { padding: 28px 32px; gap: 24px; }
  .situation { font-size: 1.4rem; max-width: none; }
}
.card-top { display: flex; justify-content: space-between; align-items: center; gap: 12px; }
.eyebrow { font-family: var(--f-display); font-weight: 800; letter-spacing: .08em; text-transform: uppercase; font-size: .82rem; color: var(--muted); }
.chip { font: 700 .75rem var(--f-display); letter-spacing: .06em; text-transform: uppercase; padding: 4px 10px; border-radius: 999px; border: 1px solid var(--line); color: var(--muted); }
.chip.right { color: var(--good); border-color: var(--good); background: var(--good-bg); }
.chip.miss { color: var(--bad); border-color: var(--bad); background: var(--bad-bg); }

.scenario { display: flex; gap: 20px; align-items: center; flex-wrap: wrap; }
.scn-text { flex: 1 1 280px; min-width: 0; }
.situation { font-size: 1.22rem; line-height: 1.45; margin: 0; max-width: 60ch; text-wrap: pretty; }
.def { margin: 10px 0 0; color: var(--muted); font-size: .95rem; }
.def b { font-family: var(--f-mono); color: var(--ink); }

/* Road / regulatory sign plates */
.plate {
  flex: 0 0 auto; width: 148px; border-radius: 12px; padding: 5px; font-family: var(--f-display); font-weight: 800; text-transform: uppercase;
}
.plate-in { border-radius: 8px; border: 3px solid; padding: 10px 8px; display: flex; flex-direction: column; align-items: center; gap: 0; text-align: center; line-height: 1.05; }
.plate .ln { font-size: 1.02rem; letter-spacing: .02em; }
.plate .big { font-size: 2.7rem; font-weight: 900; line-height: 1; margin-block: 2px; letter-spacing: -.01em; }
.plate-reg { background: var(--sign-white); color: var(--sign-black); box-shadow: 0 0 0 1px var(--line); }
.plate-reg .plate-in { border-color: var(--sign-black); }
.plate-guide { background: var(--sign-green); color: var(--sign-white); }
.plate-guide .plate-in { border-color: var(--sign-white); }
.plate-brown { background: var(--sign-brown); color: var(--sign-white); }
.plate-brown .plate-in { border-color: var(--sign-white); }
.plate-notice { background: var(--sign-white); color: var(--sign-black); box-shadow: 0 0 0 1px var(--line); }
.plate-notice .plate-in { border-color: var(--sign-black); padding-top: 0; overflow: hidden; }
.plate-notice .band { background: var(--sign-blue); color: var(--sign-white); align-self: stretch; margin: 0 -8px 8px; padding: 6px 0 4px; font-size: 1.15rem; font-weight: 900; letter-spacing: .06em; }

/* Steps */
.step { display: flex; flex-direction: column; gap: 10px; border-top: 1px solid var(--line); padding-top: 16px; }
.step h3 { margin: 0; display: flex; gap: 10px; align-items: center; font-family: var(--f-display); font-weight: 800; font-size: 1.05rem; letter-spacing: .02em; }
.stepno { width: 26px; height: 26px; border-radius: 50%; background: var(--ink); color: var(--surface); display: grid; place-items: center; font-size: .85rem; }
.expr {
  display: inline-flex; gap: 8px; align-items: center; align-self: flex-start;
  padding: 8px 12px; border-radius: 12px; border: 2px solid var(--line); background: var(--bg);
}
.expr.ok { border-color: var(--good); }
.expr.no { border-color: var(--bad); }
.slot {
  font: 700 1.7rem var(--f-mono); min-width: 52px; height: 52px; padding: 0 10px; border-radius: 8px;
  display: grid; place-items: center; background: var(--surface); border: 1px solid var(--line); color: var(--plot);
}
.slot.x { color: var(--ink); background: transparent; border-color: transparent; min-width: 0; padding: 0 4px; }
.slot.empty { color: var(--muted); border-style: dashed; }
.pickrow { display: flex; flex-wrap: wrap; gap: 8px 12px; align-items: center; }
.pickrow .seg-label { width: 70px; }
.tiles { display: flex; flex-wrap: wrap; gap: 8px; }
.tile {
  font: 700 1.25rem var(--f-mono); min-width: 58px; min-height: 52px; padding: 6px 12px; border-radius: 10px; border: 1px solid var(--line);
  background: var(--surface); color: var(--ink); cursor: pointer; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; line-height: 1.1;
}
.tile small { font: 600 .68rem var(--f-body); color: var(--muted); max-width: 11ch; text-align: center; }
.tile:hover { border-color: var(--plot); }
.tile[aria-pressed="true"] { background: var(--plot); border-color: var(--plot); color: var(--surface); }
.tile[aria-pressed="true"] small { color: var(--surface); }
.tile:disabled { cursor: default; }
.tile:disabled:not([aria-pressed="true"]) { opacity: .4; }
.tile:disabled:hover { border-color: var(--line); }
.tile[aria-pressed="true"]:disabled:hover { border-color: var(--plot); }
.ask { display: flex; flex-direction: column; gap: 8px; }
.ask-part { font-family: var(--f-display); font-weight: 800; font-size: .78rem; letter-spacing: .08em; text-transform: uppercase; color: var(--plot); }
.ask-q { margin: 0; font-size: 1.08rem; font-weight: 700; }
.tile.wrong { text-decoration: line-through; border-color: var(--bad); color: var(--bad); }
.tile.wrong:disabled { opacity: .55; }
.slot.current { border: 2px dashed var(--plot); color: var(--plot); }
.step-actions { display: flex; flex-wrap: wrap; gap: 10px; }
.lock-note { display: none; margin: 0; padding: 8px 12px; border-radius: 8px; border: 1px dashed var(--line); color: var(--muted); font-size: .95rem; }
.step.locked .lock-note { display: block; }
.step.locked .tip, .step.locked .line-wrap, .step.locked .controls { opacity: .4; pointer-events: none; }
.tip { margin: 0; font-size: .88rem; color: var(--muted); }

.line-wrap { overflow: hidden; border-radius: 12px; background: var(--bg); border: 1px solid var(--line); }
#nl { display: block; width: 100%; height: clamp(104px, 11vw, 136px); cursor: pointer; touch-action: none; user-select: none; -webkit-user-select: none; }
#nl.following { cursor: ew-resize; }
#nl:focus { outline: 3px solid var(--plot); outline-offset: -3px; border-radius: 12px; }
#nl .axis { stroke: var(--ink); stroke-width: 2.5; }
#nl .axis-head { fill: var(--ink); }
#nl .tick { stroke: var(--ink); stroke-width: 2; }
#nl .tlabel { fill: var(--ink); font: 600 15px var(--f-mono); text-anchor: middle; }
#nl .shade { stroke: var(--plot); stroke-width: 7; stroke-linecap: butt; }
#nl .shade-head { fill: var(--plot); }
#nl .pt { stroke: var(--plot); stroke-width: 3.5; }
#nl .pt.closed { fill: var(--plot); }
#nl .pt.open { fill: var(--bg); }
#nl .pt.unset { fill: var(--bg); stroke-dasharray: 4 3; }
#nl .ghost { fill: var(--plot-soft); stroke: none; pointer-events: none; }
#nl .ann { font-family: var(--f-body); font-weight: 700; text-anchor: middle; }
#nl .ann.yes { fill: var(--good); }
#nl .ann.no { fill: var(--bad); }
#nl .ann-br { fill: none; stroke-width: 2; }
#nl .ann.vert { text-anchor: start; }
#nl .ann-arrow { stroke-width: 2.5; }
#nl .ann-arrow.yes { stroke: var(--good); }
#nl .ann-arrow.no { stroke: var(--bad); }
#nl .ann-head.yes { fill: var(--good); }
#nl .ann-head.no { fill: var(--bad); }
#nl .ann-br.yes { stroke: var(--good); }
#nl .ann-br.no { stroke: var(--bad); }
#nl .hint { fill: var(--muted); font: 600 14px var(--f-body); text-anchor: middle; }

.controls { display: flex; flex-wrap: wrap; gap: 10px 18px; align-items: center; }
.seg { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
.seg-label { font-family: var(--f-display); font-weight: 800; font-size: .8rem; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); margin-right: 2px; }
.seg button {
  font: 700 .95rem var(--f-body); padding: 8px 12px; border-radius: 8px; border: 1px solid var(--line); background: var(--surface); color: var(--ink); cursor: pointer;
}
.seg button[aria-pressed="true"] { background: var(--plot); border-color: var(--plot); color: var(--surface); }
.linkbtn { background: none; border: 0; color: var(--muted); font: 600 .9rem var(--f-body); text-decoration: underline; cursor: pointer; padding: 6px; }

.fb { margin: 0; font-size: .98rem; padding: 8px 12px; border-radius: 8px; }
.fb:empty { display: none; }
.fb.ok { background: var(--good-bg); color: var(--good); border: 2px solid var(--good);
  display: flex; align-items: center; gap: 14px; padding: 12px 18px;
  font: 900 clamp(1.6rem, 4vw, 2.2rem)/1.1 var(--f-display); letter-spacing: .01em; }
.fb-sub { display: block; font: 700 1rem var(--f-body); color: var(--muted); margin-top: 4px; letter-spacing: 0; }
#fb-g.ok { cursor: pointer; flex-wrap: wrap; }
#fb-g.ok:hover { filter: brightness(.97); }
.go-next .touch { display: none; }
@media (hover: none) and (pointer: coarse) { .go-next .kb { display: none; } .go-next .touch { display: inline; } }
.go-next { margin-left: auto; font: 700 1rem var(--f-body); letter-spacing: 0; color: var(--good); background: var(--surface); border: 1.5px solid var(--good); border-radius: 999px; padding: 6px 14px; }
.ok-badge { flex: 0 0 auto; width: 1.5em; height: 1.5em; border-radius: 50%; background: var(--good); color: var(--good-bg);
  display: grid; place-items: center; font-size: .9em; }
@media (prefers-reduced-motion: no-preference) {
  .fb.ok { animation: pop .35s cubic-bezier(.2, 1.4, .4, 1); }
  @keyframes pop { from { transform: scale(.85); opacity: 0; } to { transform: none; opacity: 1; } }
}
.fb.no { background: var(--bad-bg); color: var(--bad); }
.fb code { font-family: var(--f-mono); font-weight: 700; }

.why { border-left: 4px solid var(--plot); padding: 10px 14px; background: var(--bg); border-radius: 0 10px 10px 0; font-size: 1rem; }
.why:empty { display: none; }
.why code { font-family: var(--f-mono); font-weight: 700; color: var(--plot); }
.why { display: flex; flex-direction: column; gap: 8px; font-size: 1.02rem; }
.ex-head code { font-size: 1.1rem; }
.ex-row { display: flex; gap: 12px; align-items: center; }
.ex-row > div { min-width: 0; }
.ex-label { font-weight: 700; }
.why b.yes { color: var(--good); }
.why b.no { color: var(--bad); }
.sw { flex: 0 0 auto; width: 44px; height: 16px; }
.sw-shade { stroke: var(--plot); stroke-width: 5; }
.sw-head { fill: var(--plot); }
.sw-axis { stroke: var(--ink); stroke-width: 2; }
.sw-open { fill: var(--bg); stroke: var(--plot); stroke-width: 2.5; }
.sw-closed { fill: var(--plot); stroke: var(--plot); stroke-width: 2.5; }

.actions { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; border-top: 1px solid var(--line); padding-top: 16px; }
.count { font: 700 .95rem var(--f-mono); color: var(--muted); font-variant-numeric: tabular-nums; white-space: nowrap; }
.count b { color: var(--good); font-size: 1.15rem; }
.goal { display: inline-flex; align-items: center; gap: 10px; }
@media (max-width: 520px) {
  .goal { order: -1; flex-basis: 100%; }
  .goal-bar { flex: 1 1 auto; width: auto; }
  .actions .spacer { display: none; }
}
.goal-bar { width: 120px; height: 10px; border-radius: 99px; background: var(--bg); border: 1px solid var(--line); overflow: hidden; }
.goal-bar > span { display: block; height: 100%; background: var(--good); border-radius: 99px; }
.finish { background: var(--surface); border: 2px solid var(--good); border-radius: 16px; padding: 40px 24px; display: flex; flex-direction: column; align-items: center; gap: 14px; text-align: center; }
.finish .big-check { width: 84px; height: 84px; border-radius: 50%; background: var(--good); color: var(--good-bg); display: grid; place-items: center; font-size: 46px; font-weight: 900; }
.finish h2 { margin: 0; font: 900 clamp(2rem, 6vw, 3rem)/1.05 var(--f-display); color: var(--good); }
.finish p { margin: 0; font-size: 1.15rem; color: var(--muted); }
.actions .spacer { flex: 1 1 auto; }
.btn { font: 800 .95rem var(--f-display); letter-spacing: .05em; text-transform: uppercase; padding: 11px 18px; border-radius: 10px; cursor: pointer; border: 1px solid var(--line); background: var(--surface); color: var(--ink); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.btn.ghost { background: transparent; }
.btn:disabled { opacity: .45; cursor: default; }
button:focus-visible, summary:focus-visible { outline: 3px solid var(--plot); outline-offset: 2px; }

@media (max-width: 520px) {
  .card { padding: 16px; }
  .plate { width: 124px; }
  .plate .big { font-size: 2.3rem; }
  .guide-side { align-items: flex-start; }
  .score { text-align: left; }
  .situation { font-size: 1.1rem; }
}
@media (prefers-reduced-motion: no-preference) {
  .card { animation: in .25s ease-out; }
  @keyframes in { from { transform: translateY(4px); opacity: .6; } to { transform: none; opacity: 1; } }
}

/* ---- One-screen layout: the card fills the window; the number line shrinks to fit ---- */
html, body { height: 100%; }
body { margin: 0; }
[hidden] { display: none !important; }
.wrap { height: 100%; padding-block: 10px; gap: 0; }
#card { flex: 1 1 auto; min-height: 0; display: flex; flex-direction: column; }
.card { flex: 1 1 auto; min-height: 0; overflow: auto; gap: 12px; padding: 14px 22px; }
.card > *, .step > * { flex-shrink: 0; }
.step { padding-top: 10px; gap: 8px; }
.step-head { display: flex; flex-wrap: wrap; align-items: center; gap: 10px 16px; }
.step-head .fb { flex: 1 1 260px; }
.slot { height: 46px; min-width: 46px; font-size: 1.5rem; }
.tile { min-height: 46px; }
.ask { gap: 6px; }
.fb.ok { padding: 6px 14px; font-size: clamp(1.4rem, 3vw, 2rem); gap: 12px; }
.line-wrap { position: relative; }
#nl { position: absolute; inset: 0; width: 100%; height: 100%; }
.graph-row { display: flex; flex-wrap: wrap; align-items: center; gap: 10px 16px; }
.graph-row .spacer { flex: 1 1 auto; }
.real { display: flex; flex-direction: column; gap: 2px; flex-shrink: 0; }
.real-cap { margin: 0; font-size: .95rem; color: var(--muted); }
.real-cap b { color: var(--ink); }
.graph-cap { margin: -2px 0 0; font-size: .95rem; color: var(--muted); }
.graph-cap b { color: var(--ink); }
.graph-cap code { font-family: var(--f-mono); font-weight: 700; color: var(--plot); }
.real { border-top: 1px dashed var(--line); padding-top: 6px; }
.expr.mini { padding: 4px 8px; gap: 6px; }
.expr.mini .slot { height: 40px; min-width: 40px; font-size: 1.3rem; }
#rl { display: block; width: 100%; height: 64px; }
#rl .axis { stroke: var(--muted); stroke-width: 2; }
#rl .axis-head { fill: var(--muted); }
#rl .tick { stroke: var(--muted); stroke-width: 1.5; }
#rl .tlabel { fill: var(--muted); font: 600 13px var(--f-mono); text-anchor: middle; }
#rl .rdot { fill: var(--good); }
#rl .rseg { stroke: var(--good); stroke-width: 6; stroke-linecap: butt; }
#rl .rend.closed { fill: var(--good); stroke: var(--good); stroke-width: 3; }
#rl .rend.open { fill: var(--bg); stroke: var(--good); stroke-width: 3; }
#rl .more { fill: var(--good); font: 900 22px var(--f-display); }
#rl .gs1 { stop-color: var(--good); stop-opacity: 1; }
#rl .gs0 { stop-color: var(--good); stop-opacity: 0; }
.plate { width: 116px; }
.plate .ln { font-size: .85rem; }
.plate .big { font-size: 2.1rem; }
.plate-in { padding: 6px; }
.plate-notice .band { font-size: .95rem; padding: 4px 0 2px; margin-bottom: 4px; }
.scenario { gap: 16px; }
.actions { padding-top: 10px; }
@media (min-width: 900px) { .card { padding: 18px 28px; gap: 14px; } }
@media (max-width: 520px) { .card { padding: 10px 14px; gap: 8px; } .plate { width: 92px; } .plate .big { font-size: 1.6rem; } .scenario { flex-wrap: nowrap; gap: 12px; } .scn-text { flex: 1 1 0; } .situation { font-size: 1.02rem; } .real-cap { font-size: .86rem; line-height: 1.35; } #rl { height: 52px; } .graph-cap .long { display: none; } .graph-cap { font-size: .88rem; } .fb.ok { font-size: 1.3rem; padding: 4px 10px; } .go-next { font-size: .85rem; padding: 4px 10px; } .plate { width: 84px; } .plate .big { font-size: 1.45rem; } .plate .ln { font-size: .72rem; } }

/* ---- turn-in page ---- */
.turnin { flex: 1 1 auto; min-height: 0; overflow: auto; background: var(--surface); border: 2px solid var(--good); border-radius: 16px;
  padding: 20px clamp(16px, 4vw, 36px); display: flex; flex-direction: column; gap: 14px; }
.ti-top { display: flex; align-items: center; gap: 18px; }
.turnin .big-check { flex: 0 0 auto; width: 64px; height: 64px; border-radius: 50%; background: var(--good); color: var(--good-bg); display: grid; place-items: center; font-size: 36px; font-weight: 900; }
.turnin h2 { margin: 0; font: 900 clamp(1.8rem, 5vw, 2.6rem)/1.05 var(--f-display); color: var(--good); }
.ti-sub { margin: 4px 0 0; color: var(--muted); font-size: 1.05rem; }
#gform { display: flex; flex-direction: column; gap: 12px; max-width: 760px; }
.ti-warn { background: var(--good-bg); border-radius: 10px; padding: 10px 14px; font-size: .98rem; }
.ti-fields { display: grid; grid-template-columns: 110px 1fr 1fr; gap: 12px; }
@media (max-width: 600px) { .ti-fields { grid-template-columns: 1fr; } }
.ti-field label { display: flex; align-items: center; margin-bottom: 4px; font-weight: 700; }
.ti-num { display: inline-flex; align-items: center; justify-content: center; width: 22px; height: 22px; margin-right: 8px; border-radius: 50%; background: var(--ink); color: var(--surface); font-size: 13px; }
.ti-field input { font: inherit; font-size: 1.05rem; color: var(--ink); width: 100%; border: 1.5px solid var(--line); border-radius: 10px; padding: 9px 12px; background: var(--bg); }
.ti-field input:focus { outline: 2px solid var(--plot); outline-offset: 1px; }
.ti-check { border: 1.5px solid var(--line); border-radius: 10px; padding: 10px 14px; display: grid; gap: 2px; }
.ti-check .hd { color: var(--muted); font-size: .9rem; }
.ti-check .r { display: flex; gap: 12px; align-items: baseline; }
.ti-check .r:last-child { padding-top: 4px; border-top: 1px solid var(--line); margin-top: 2px; }
.ti-check .t { color: var(--muted); min-width: 88px; font-size: .9rem; }
.ti-check .v.empty { color: var(--muted); }
.ti-btn { align-self: flex-start; font-size: 1.05rem; padding: 12px 22px; }
.ti-feedback { margin: 0; font-size: 1.05rem; }
.ti-feedback:empty { display: none; }
.ti-feedback .ok { color: var(--good); font: 900 1.6rem var(--f-display); }
.ti-feedback .nt { color: var(--muted); }
.ti-after { display: flex; }
.turnin-btn { border-color: var(--good); color: var(--good); }
.turnin h2.early { color: var(--ink); }
.turnin:has(h2.early) { border-color: var(--line); }

  }
  // While following, the arrow tracks the pointer anywhere on the page
  let togglePress = null;
  window.addEventListener('pointerup', () => { setTimeout(() => { togglePress = null; }, 0); });
  window.addEventListener('pointermove', e => {
    const it = cur(); if (!it) return;
    if (togglePress && !it.following) {
      // Pressed on the circle and moved: treat it as redrawing the arrow
      const x = svgX(e);
      if (x !== null && Math.abs(x - togglePress.x) > 12) {
        pressX = togglePress.x; togglePress = null;
        it.following = true; it.drag = x;
        const svg = $('#nl'); if (svg) svg.classList.add('following');
        drawLine();
      }
      return;
    }
    if (!it.following) return;
    const x = svgX(e); if (x === null) return;
    it.drag = x; drawLine();
  });
  // Clicking anywhere off the number line, or pressing Escape, stops following without changing the arrow
  document.addEventListener('pointerdown', e => {
    const it = cur(); if (!it || !it.following || e.target.closest('#nl')) return;
    stopFollow(it); drawLine();
  }, true);
  document.addEventListener('keydown', e => {
    const it = cur(); if (e.key !== 'Escape' || !it || !it.following) return;
    stopFollow(it); drawLine();
  });
  function bindCard() {
    const it = cur();
    document.querySelectorAll('[data-v]').forEach(x => x.addEventListener('click', () => pickPart('v', x.dataset.v)));
    document.querySelectorAll('[data-s]').forEach(x => x.addEventListener('click', () => pickPart('s', x.dataset.s)));
    document.querySelectorAll('[data-n]').forEach(x => x.addEventListener('click', () => pickPart('n', x.dataset.n)));

    const svg = $('#nl');
    const ghost = cx => { const gh = $('#ghost'); if (gh) gh.setAttribute('cx', cx); };
    svg.addEventListener('pointerdown', e => {
      if (!it.aOk || it.done) return;
      const x = svgX(e); if (x === null) return;
      e.preventDefault();
      if (it.following) { commitArrow(it, x); return; }
      const onCircle = it.g.p !== null && Math.abs(x - tickX(it.g.p)) < 22;
      // Once the arrow is drawn, clicking the circle switches open/closed (dragging from it still redraws the arrow)
      if (onCircle && it.g.d) { togglePress = { x }; return; }
      if (!onCircle) { it.g.p = idxAt(x); it.g.d = null; }
      if (!it.g.c) it.g.c = 'open';
      it.following = true; it.drag = x; pressX = x;
      svg.classList.add('following');
      drawLine();
    });
    svg.addEventListener('pointerup', e => {
      if (togglePress) {
        togglePress = null;
        it.g.c = it.g.c === 'closed' ? 'open' : 'closed';
        paintCard(); return;
      }
      // Press-and-drag also works: letting go far from where you pressed sets the arrow
      if (it.following && pressX !== null) {
        const x = svgX(e);
        if (x !== null && Math.abs(x - pressX) > 25) commitArrow(it, x);
      }
      pressX = null;
    });
    svg.addEventListener('pointermove', e => {
      if (it.following) return;
      const x = svgX(e); if (x === null) return;
      ghost(it.aOk && !it.done ? tickX(idxAt(x)) : -100);
    });
    svg.addEventListener('pointerleave', () => ghost(-100));
    svg.addEventListener('keydown', e => {
      if (!it.aOk) return;
      if (e.key === 'ArrowLeft' || e.key === 'ArrowRight') {
        e.preventDefault();
        if (!it.g.c) it.g.c = 'open';
        if (e.shiftKey) { if (it.g.p === null) it.g.p = 0; it.g.d = e.key === 'ArrowRight' ? 'right' : 'left'; }
        else if (it.g.p === null) it.g.p = 0;
        else it.g.p = Math.max(0, Math.min(N_TICKS - 1, it.g.p + (e.key === 'ArrowRight' ? 1 : -1)));
        paintCard(); $('#nl').focus();
      } else if (e.key === ' ' && it.g.p !== null) {
        e.preventDefault();
        it.g.c = it.g.c === 'closed' ? 'open' : 'closed';
        paintCard(); $('#nl').focus();
      }
    });
    document.querySelectorAll('[data-c]').forEach(x => x.addEventListener('click', () => { it.g.c = x.dataset.c; paintCard(); }));
    $('#clear').addEventListener('click', () => { it.g = { p: null, c: null, d: null }; paintCard(); });
    $('#check-g').addEventListener('click', checkGraph);
    $('#prev').addEventListener('click', () => { if (state.i > 0) { state.i--; renderAll(); } });
    $('#fb-g').addEventListener('click', () => { if (cur().done) goNext(); });
    $('#fb-g').addEventListener('keydown', e => { if ((e.key === ' ') && cur().done) { e.preventDefault(); goNext(); } });
    const tb = $('#turnin-btn'); if (tb) tb.addEventListener('click', openTurnIn);
  }
  document.addEventListener('keydown', e => {
    if (e.key !== 'Enter' || e.repeat || e.altKey || e.ctrlKey || e.metaKey) return;
    const it = cur(); if (!it || state.finished) return;
    if (e.target.closest && e.target.closest('input, textarea, select, form')) return;
    e.preventDefault();
    if (it.done) {
      goNext();
    } else if (it.aOk && it.g.p !== null) {
      checkGraph();
    }
  }, true);
  document.addEventListener('click', e => {
    const go = e.target.closest('[data-go]');
    if (go) { state.i = +go.dataset.go; renderAll(); }
  });

  startDrill();
})();
</script>

</body>
</html>
